name: SkinSense CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. Express Backend Tests + Contract Tests
  # -------------------------------------------------------------
  test-server:
    name: Server & Contract Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suite with Coverage
        run: npm test -- --coverage

  # -------------------------------------------------------------
  # 2. React Frontend Tests (Vitest)
  # -------------------------------------------------------------
  test-client:
    name: Client Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest in CI mode
        run: npm test -- --run

  # -------------------------------------------------------------
  # 3. Python ML Inference Service (pytest + Golden Set)
  # -------------------------------------------------------------
  test-inference:
    name: ML Service & Robustness Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: inference/requirements.txt

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install service dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run pytest (Unit + Golden Regressions)
        env:
          MODEL_PATH: "/nonexistent/model.pth"
          ASR_MODEL_PATH: "/nonexistent/asr"
          HEATMAP_DIR: "/tmp/skinsense_heatmaps"
          INFERENCE_PORT: "5002"
        run: |
          python -m pytest tests/ -v --cov=.

  # -------------------------------------------------------------
  # 4. Streamlit Monitoring Dashboard Tests
  # -------------------------------------------------------------
  test-dashboard:
    name: Dashboard Regression Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pandas streamlit

      - name: Run dashboard pytest
        run: python -m pytest tests/ -v
        